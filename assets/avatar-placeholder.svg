<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d18" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <path d="M0,50 H300 M0,100 H300 M0,150 H300 M0,200 H300 M0,250 H300" stroke="#00A3FF" stroke-opacity="0.1" stroke-width="1" />
  <path d="M50,0 V300 M100,0 V300 M150,0 V300 M200,0 V300 M250,0 V300" stroke="#00A3FF" stroke-opacity="0.1" stroke-width="1" />

  <!-- Tech Circle Reticle -->
  <circle cx="150" cy="140" r="90" fill="none" stroke="#00A3FF" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4" />
  <circle cx="150" cy="140" r="115" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="2,8" />

  <!-- Stylized Cybernetic Avatar Silhouette -->
  <!-- Torso & Suit -->
  <path d="M70,270 L85,200 L115,185 L150,210 L185,185 L215,200 L230,270 Z" fill="#0c1626" stroke="#00A3FF" stroke-width="1.5" />
  <path d="M125,188 L150,230 L175,188 Z" fill="#142847" stroke="#00A3FF" stroke-width="1" />
  <line x1="150" y1="230" x2="150" y2="280" stroke="#00A3FF" stroke-width="2" stroke-dasharray="4,2" />

  <!-- Neck -->
  <rect x="135" y="150" width="30" height="35" fill="#142847" stroke="#00A3FF" stroke-opacity="0.6" stroke-width="1" />

  <!-- Head Outline -->
  <path d="M110,120 C110,80 130,65 150,65 C170,65 190,80 190,120 C190,150 170,165 150,165 C130,165 110,150 110,120 Z" fill="#081424" stroke="#00A3FF" stroke-width="2" />

  <!-- Hair / Frame -->
  <path d="M108,110 C108,70 125,55 150,55 C175,55 192,70 192,110 C180,85 160,80 150,80 C140,80 120,85 108,110 Z" fill="#00A3FF" fill-opacity="0.3" stroke="#00A3FF" stroke-width="1" />

  <!-- Glasses / HUD Visor -->
  <rect x="118" y="105" width="28" height="18" rx="2" fill="#00A3FF" fill-opacity="0.25" stroke="#00A3FF" stroke-width="1.5" filter="url(#glow)" />
  <rect x="154" y="105" width="28" height="18" rx="2" fill="#00A3FF" fill-opacity="0.25" stroke="#00A3FF" stroke-width="1.5" filter="url(#glow)" />
  <line x1="146" y1="114" x2="154" y2="114" stroke="#00A3FF" stroke-width="2" />
  <line x1="118" y1="112" x2="110" y2="112" stroke="#00A3FF" stroke-width="1.5" />
  <line x1="182" y1="112" x2="190" y2="112" stroke="#00A3FF" stroke-width="1.5" />

  <!-- HUD Data Elements -->
  <text x="20" y="30" fill="#00A3FF" font-family="monospace" font-size="10" letter-spacing="1">ID: AUM_GAJJAR // 0xDA7A</text>
  <text x="20" y="44" fill="#ffffff" font-family="monospace" font-size="8" opacity="0.6">ROLE: DATA ANALYST &amp; ENGR</text>
  <text x="20" y="285" fill="#00A3FF" font-family="monospace" font-size="9">STATUS: ONLINE [TORONTO, CA]</text>

  <!-- Corner Brackets -->
  <path d="M10,25 L10,10 L25,10" stroke="#00A3FF" stroke-width="2" fill="none" />
  <path d="M290,25 L290,10 L275,10" stroke="#00A3FF" stroke-width="2" fill="none" />
  <path d="M10,275 L10,290 L25,290" stroke="#00A3FF" stroke-width="2" fill="none" />
  <path d="M290,275 L290,290 L275,290" stroke="#00A3FF" stroke-width="2" fill="none" />
</svg>
